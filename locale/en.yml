ekumanov-claude-reply:
  admin:
    permissions:
      bypass_user_limit: Bypass the per-member Claude reply limit

    settings:
      # --- sections ---------------------------------------------------------
      section_general: Connection
      section_access: Who may summon a reply
      section_where: Where it may reply
      section_limits: Spend limits
      section_model: Model and generation
      section_voice: Voice

      access_intro: >-
        Deny lists win over allow lists, and a person wins over their groups. So a member of
        an allowed group can be denied individually, and a member of a denied group can be
        allowed individually. Leaving the member lists empty does NOT mean nobody — it means
        the question passes down to the groups, which is why allowing a group on its own works
        fine. Only somebody matched by no list at all is refused, and the switch below changes
        what happens to them.

      # --- connection -------------------------------------------------------
      enabled: Enable Claude replies
      enabled_help: >-
        Master switch. While off, nothing is queued and nothing is billed. A working queue
        driver is also required — this extension refuses to run on the sync queue, because a
        reply takes far longer than a web request should.

      api_key: Anthropic API key
      api_key_help: >-
        Only needed if you have not put the key in config.php. A key in config.php (or in the
        ANTHROPIC_API_KEY environment variable) always wins over this field, and is the safer
        place for it: a key saved here is stored in the settings table, so it ends up in your
        database backups and in your settings cache. It is never sent to the browser, and it
        is never shown again after saving.
      api_key_stored: A key is stored. Type a new one to replace it, or clear the field to remove it.
      api_key_overridden: >-
        A key from {source} is in use and takes precedence — whatever you save here will be
        ignored until that one is removed.
      api_key_missing: No key configured. Replies cannot be generated until one is set.
      api_key_placeholder: sk-ant-...

      bot_account: Bot account
      bot_account_help: >-
        The forum account Claude posts as. Mentioning this account is what triggers a reply.
        It needs Reply permission in the tags it answers in, and it must not be in a group
        whose posts require approval — otherwise replies are generated, billed, and never
        appear.
      bot_account_unset: No account selected — falling back to the username "{username}".
      bot_account_missing: '"{username}" does not exist on this forum.'

      # --- access -----------------------------------------------------------
      admin_bypass_access: Administrators are always allowed
      admin_bypass_access_help: >-
        Administrators skip the lists below and the per-member limit. On by default: gating
        someone who can edit these settings achieves nothing, and being quietly excluded from
        a feature you administer is a confusing way to discover it.

      users_blocklist_mode: Allow everyone except those denied
      users_blocklist_mode_help: >-
        Off (default): only the members and groups listed below may summon a reply. On: anyone
        may, except those you deny. Every other rule is unchanged — deny still beats allow, and
        an individual entry still beats a group one. Turning this on lets any member spend your
        API budget, bounded only by the two limits further down.

      allowed_users: Allowed members
      allowed_users_help: >-
        Members permitted to summon a reply. Leaving this empty does not mean nobody — it hands
        the decision to the groups below.
      denied_users: Denied members
      denied_users_help: >-
        Members who may never summon a reply, even if they are allowed above or belong to an
        allowed group. This is the highest-precedence list of all.

      allowed_groups: Allowed groups
      allowed_groups_help: >-
        Every member of these groups may summon a reply, unless they are individually denied.
      denied_groups: Denied groups
      denied_groups_help: >-
        Members of these groups may not summon a reply — unless they are individually
        allowed, which overrides their group.

      tags_blocklist_mode: Answer in all tags except those denied
      tags_blocklist_mode_help: >-
        Off (default): the bot answers only in the tags listed below. On: it answers anywhere
        except the tags you deny. Remember what a tag list controls — every post in an answered
        discussion may be sent to Anthropic as context — so turning this on opts your whole
        forum in, minus the exceptions.

      admin_bypass_tags: Administrators may answer in any tag
      admin_bypass_tags_help: >-
        OFF by default, unlike the access bypass above, and deliberately so. The tag lists are
        not about who is trusted; they decide which of your members' content is allowed to
        leave the forum. An administrator absent-mindedly mentioning the bot in a private-ish
        tag is exactly the accident the list prevents. Private discussions are always refused
        regardless of this setting.

      allowed_tags: Allowed tags
      allowed_tags_help: >-
        Tags the bot will answer in. Empty means no tag, unless the switch above is on. Every post in an answered discussion
        may be sent to Anthropic as context, so opt in per tag deliberately. Selecting a
        parent tag covers its children, because a discussion in a child tag carries the
        parent too. Private discussions are always refused, whatever is listed here.
      denied_tags: Denied tags
      denied_tags_help: >-
        Tags the bot will never answer in. One denied tag on a discussion is enough to refuse
        it, even if another of its tags is allowed.

      # --- limits -----------------------------------------------------------
      per_user_daily_limit: Replies per member per 24 hours
      per_user_daily_limit_help: >-
        How many replies one member may summon in a rolling 24-hour window. Set to 0 for no
        per-member limit. When a member is out, the composer warns them before they post and
        no reply is generated — they can still post, they just will not get an answer.
        Groups granted "Bypass the per-member Claude reply limit" under Permissions ignore
        this (admins always do); the forum-wide limit below still applies to everyone.
      daily_reply_limit: Replies per 24 hours (whole forum)
      daily_reply_limit_help: >-
        Forum-wide spend ceiling over a rolling 24-hour window. Unlike the per-member limit,
        0 here blocks all replies.

      # --- model ------------------------------------------------------------
      model: Model
      model_help: Model ID passed to the Messages API. Default claude-opus-5.
      model_loading: Loading available models…
      model_refresh: Refresh list
      model_custom: Enter a model ID manually
      model_choose: Choose from your account's models
      model_unavailable: >-
        Could not load the model list ({error}) — enter a model ID manually.
      model_no_key: Add an API key to load the list of models your account can use.
      model_current: 'Currently set: {model}'
      model_effort_unsupported: >-
        This model does not support the effort setting; it will be ignored.

      effort: Effort
      effort_help: >-
        Controls how much the model thinks and spends. Forum replies rarely need more than
        medium; raise it if answers feel shallow.

      max_tokens: Max response tokens
      max_tokens_help: >-
        Hard ceiling on the response INCLUDING thinking tokens. Sizing this to the visible
        answer alone will truncate replies mid-sentence.

      context_token_budget: Context token budget
      context_token_budget_help: >-
        Input-token ceiling for the thread excerpt. The builder walks backwards from the
        mention until this is reached. The opening post is always included.

      max_context_posts: Max context posts
      max_context_posts_help: Hard cap on posts pulled into context, whatever the token budget allows.

      trigger_on_quote: Also reply when quoted
      trigger_on_quote_help: >-
        Flarum's Reply arrow and Quote button insert a link to a post, not a mention of an
        account, so by default they do not summon the bot — only an @-mention does. Turn this
        on to treat replying to or quoting one of the bot's own posts as a summons too. Off by
        default because in a discussion about the bot, members quote it in order to talk about
        it, and it would join every one of those conversations uninvited.

      web_search: Allow web search
      web_search_help: >-
        Lets Claude run server-side web searches while composing a reply, rather than
        answering from memory alone. Billed separately (about $10 per 1,000 searches).

      web_search_max_uses: Max searches per reply
      web_search_max_uses_help: Caps searches for a single reply.

      # --- voice ------------------------------------------------------------
      persona_prompt: Persona / house style
      persona_prompt_help: >-
        Appended to the built-in system prompt. Describe the community, the audience, the tone
        and the language you want. Output format, quoting rules and safety rules are already
        handled; use this for voice.

      footer: Reply footer
      footer_help: >-
        Markdown appended to every reply — typically an AI-disclosure line. Leave empty to
        disable.

    # --- shared picker UI ---------------------------------------------------
    picker:
      search_users: Search members by name…
      search_tags: Search tags…
      search_groups: Search groups…
      no_results: No matches
      empty_users: No members selected
      empty_tags: No tags selected
      empty_groups: No groups selected
      remove: Remove
      searching: Searching…
      unknown_user: 'Unknown member (id {id})'
      unknown_tag: 'Unknown tag (id {id})'
      unknown_group: 'Unknown group (id {id})'

  forum:
    quota:
      title: No Claude reply for this post
      exhausted_one: >-
        You have used your one Claude reply for today, so mentioning {bot} in this post will
        not produce an answer. You can still post it.
      exhausted_many: >-
        You have used all {limit} of your Claude replies for the last 24 hours, so mentioning
        {bot} in this post will not produce an answer. You can still post it.
      post_anyway: Post anyway
      cancel: Back to editing
